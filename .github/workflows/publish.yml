# Hourly: gather the newest bus GPS pings, roll them up to hourly speeds,
# commit the archive, and publish the site.
#
# Two ways to gather pings, chosen automatically:
#   - Cloudflare (preferred): the Worker in worker/ records the feed every
#     minute into R2. This job downloads the last two UTC days from R2.
#     Needs secrets CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN,
#     R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
#   - GitHub only: with no R2 secrets, this job listens to the feed itself
#     for 20 minutes each hour.
#
# Scheduled runs only fire on the repository's default branch.
name: Collect and publish
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "worker/**", "wrangler.jsonc", "data/hourly/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: aviary-vermont-speeds-publish
  cancel-in-progress: false
env:
  R2_BUCKET: aviary-vermont-speeds-bucket
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  SWIFTLY_API_KEY: ${{ secrets.SWIFTLY_API_KEY }}
  HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
  TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20  # enough history for the commit step to rebase onto a moved main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download pings recorded by the Cloudflare Worker
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/raw/$day/" "run/raw/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          done

      - name: Download and convert Swiftly snapshots
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/swiftly/vp/$day/" "run/swiftly/vp/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          done
          if [ -d run/swiftly/vp ]; then
            python pipeline/swiftly_to_pings.py --in run/swiftly/vp --out run/raw/swiftly
          fi

      - name: Download TomTom and HERE traffic and roll up general-traffic speeds
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/traffic/tomtom/$day/" "run/traffic/tomtom/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          done
          if [ -d run/traffic/tomtom ]; then
            python pipeline/build_traffic.py --raw run/traffic/tomtom
          fi
          # HERE flow (every 90 minutes, one file per street), a cross-check on TomTom
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/traffic/here/$day/" "run/traffic/here/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          done
          if [ -d run/traffic/here ]; then
            python pipeline/build_traffic.py --provider here --raw run/traffic/here || echo "HERE roll-up failed"
          fi

      - name: Or listen to the feed from here (no Cloudflare storage configured)
        if: env.AWS_ACCESS_KEY_ID == '' && github.event_name != 'push'
        run: python pipeline/collect_realtime.py --routes 204,754,2,4 --minutes 20 --out run/raw

      - name: Roll up to hourly speeds
        run: |
          if [ -n "$(find run/raw -name 'vehicle_positions_*' 2>/dev/null | head -1)" ]; then
            python pipeline/build_observed.py --raw run/raw --out data/observed --export run/export
            for corridor in corridors/*.json; do
              python pipeline/build_observed_corridor.py --corridor "$corridor" --raw run/raw || echo "no pings for $corridor"
            done
          else
            echo "No new pings this run."
          fi

      - name: Store daily raw and MDS telemetry files in R2
        if: env.AWS_ACCESS_KEY_ID != '' && hashFiles('run/export/*') != ''
        run: |
          E="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp run/export/ "s3://$R2_BUCKET/daily/" --recursive --exclude "*" --include "vehicle_positions_*" --only-show-errors --endpoint-url "$E"
          aws s3 cp run/export/ "s3://$R2_BUCKET/mds/" --recursive --exclude "*" --include "mds_telemetry_*" --only-show-errors --endpoint-url "$E"

      - name: Or keep them as a workflow artifact
        if: env.AWS_ACCESS_KEY_ID == '' && hashFiles('run/export/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pings-${{ github.run_id }}
          path: run/export
          retention-days: 90

      - name: Commit the observed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python pipeline/build_datapackage.py
          git add data/observed data/corridors data/traffic datapackage.json
          git diff --cached --quiet || git commit -m "Observed speeds $(date -u +%Y-%m-%dT%H:00Z)"
          # main may have moved while this run worked (a code push, another run): rebase onto it and retry.
          # On a conflict in data files, keep this run's freshly computed version ("theirs" during a rebase).
          for attempt in 1 2 3 4; do
            git push && break
            sleep $((attempt * 5))
            git pull --rebase -X theirs origin main
          done

      - name: Build the site
        run: |
          python pipeline/build_datapackage.py
          python pipeline/build_site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy site, API routes and collector to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        # A token problem here must not stop data collection or the GitHub Pages deploy.
        continue-on-error: true
        run: |
          npx --yes wrangler@4 deploy
          npx --yes wrangler@4 deploy -c wrangler.gbfs.jsonc
          npx --yes wrangler@4 deploy -c wrangler.traffic.jsonc
          if [ -n "$TOMTOM_API_KEY" ]; then
            printf '%s' "$TOMTOM_API_KEY" | npx --yes wrangler@4 secret put TOMTOM_API_KEY -c wrangler.traffic.jsonc
          fi
          if [ -n "$HERE_API_KEY" ]; then
            printf '%s' "$HERE_API_KEY" | npx --yes wrangler@4 secret put HERE_API_KEY -c wrangler.traffic.jsonc
          fi
          if [ -n "$SWIFTLY_API_KEY" ]; then
            printf '%s' "$SWIFTLY_API_KEY" | npx --yes wrangler@4 secret put SWIFTLY_API_KEY
          fi

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    # Needs Settings > Pages > Source set to "GitHub Actions"; until then this job fails without stopping collection.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

# Hourly data collection: every call to an outside service (R2, CCRS) and every data commit, nothing else.
#   - downloads the last two UTC days of bus pings, Swiftly snapshots, TomTom/HERE traffic and TomTom incidents from R2
#   - rolls them up into data/ (observed speeds, traffic, incidents), refreshes CCRS deaths once a day
#   - stores the permanent daily raw and MDS files back in R2, regenerates datapackage.json, commits data/
# It does not build or deploy anything: "Build and deploy site" (site.yml) runs after it, and Worker code is deployed
# by "Deploy collectors" (workers.yml). Commits made with GITHUB_TOKEN do not trigger push workflows, hence the
# workflow_run hand-off.
#
# Without R2 secrets it listens to Metro's feed itself for 20 minutes instead. Scheduled runs fire on main only.
name: Collect and roll up
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aviary-data   # shared with calitp-history.yml so data commits never race
  cancel-in-progress: false
env:
  R2_BUCKET: aviary-vermont-speeds-bucket
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  # R2 sometimes answers "InternalError ... please try again"; retry harder than the CLI's default of 2 attempts
  AWS_RETRY_MODE: standard
  AWS_MAX_ATTEMPTS: "8"
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20  # enough history for the commit step to rebase onto a moved main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download pings recorded by the Cloudflare Worker
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/raw/$day/" "run/raw/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              || echo "::warning::R2 download failed for $day; continuing with what was fetched"
          done

      - name: Download and convert Swiftly snapshots
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/swiftly/vp/$day/" "run/swiftly/vp/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              || echo "::warning::R2 download failed for $day; continuing with what was fetched"
          done
          if [ -d run/swiftly/vp ]; then
            python pipeline/swiftly_to_pings.py --in run/swiftly/vp --out run/raw/swiftly
          fi

      - name: Download TomTom and HERE traffic and incidents, and roll them up
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/traffic/tomtom/$day/" "run/traffic/tomtom/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              || echo "::warning::R2 download failed for $day; continuing with what was fetched"
          done
          if [ -d run/traffic/tomtom ]; then
            python pipeline/build_traffic.py --raw run/traffic/tomtom
          fi
          # HERE flow (every 90 minutes, one file per street), a cross-check on TomTom
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/traffic/here/$day/" "run/traffic/here/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              || echo "::warning::R2 download failed for $day; continuing with what was fetched"
          done
          if [ -d run/traffic/here ]; then
            python pipeline/build_traffic.py --provider here --raw run/traffic/here || echo "HERE roll-up failed"
          fi
          # TomTom incidents (every 20 minutes, one box over all streets)
          for day in "$(date -u +%F)" "$(date -u -d yesterday +%F)"; do
            aws s3 sync "s3://$R2_BUCKET/traffic/incidents/$day/" "run/traffic/incidents/$day/" --only-show-errors \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              || echo "::warning::R2 download failed for $day; continuing with what was fetched"
          done
          if [ -d run/traffic/incidents ]; then
            python pipeline/build_incidents.py --raw run/traffic/incidents || echo "incident roll-up failed"
          fi

      - name: Or listen to the feed from here (no Cloudflare storage configured)
        if: env.AWS_ACCESS_KEY_ID == ''
        run: python pipeline/collect_realtime.py --routes 204,754,2,4 --minutes 20 --out run/raw

      - name: Refresh traffic deaths from CCRS (once a day, 15:00 UTC run)
        run: |
          if [ "$(date -u +%H)" = "15" ] || [ ! -f data/reference/fatalities_ccrs.csv ]; then
            python pipeline/fetch_fatalities.py || echo "CCRS fatality refresh failed"
          fi

      - name: Roll up to hourly speeds
        run: |
          if [ -n "$(find run/raw -name 'vehicle_positions_*' 2>/dev/null | head -1)" ]; then
            python pipeline/build_observed.py --raw run/raw --out data/observed --export run/export
            for corridor in corridors/*.json; do
              python pipeline/build_observed_corridor.py --corridor "$corridor" --raw run/raw || echo "no pings for $corridor"
            done
          else
            echo "No new pings this run."
          fi

      - name: Store daily raw and MDS telemetry files in R2
        if: env.AWS_ACCESS_KEY_ID != '' && hashFiles('run/export/*') != ''
        run: |
          E="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp run/export/ "s3://$R2_BUCKET/daily/" --recursive --exclude "*" --include "vehicle_positions_*" --only-show-errors --endpoint-url "$E"
          aws s3 cp run/export/ "s3://$R2_BUCKET/mds/" --recursive --exclude "*" --include "mds_telemetry_*" --only-show-errors --endpoint-url "$E"

      - name: Or keep them as a workflow artifact
        if: env.AWS_ACCESS_KEY_ID == '' && hashFiles('run/export/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pings-${{ github.run_id }}
          path: run/export
          retention-days: 90

      - name: Commit the observed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python pipeline/build_datapackage.py
          git add data/observed data/corridors data/traffic data/reference/fatalities_ccrs.csv datapackage.json && { [ -d data/incidents ] && git add data/incidents || true; }
          git diff --cached --quiet || git commit -m "Observed speeds $(date -u +%Y-%m-%dT%H:00Z)"
          # main may have moved while this run worked (a code push, another run): rebase onto it and retry.
          # On a conflict in data files, keep this run's freshly computed version ("theirs" during a rebase).
          for attempt in 1 2 3 4; do
            git push && break
            sleep $((attempt * 5))
            git pull --rebase -X theirs origin main
          done

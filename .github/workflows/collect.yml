# Samples live bus positions on Vermont Av every hour and appends the observed
# hourly speeds to the archive. Scheduled runs only fire on the default branch.
name: Collect observed speeds
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to listen
        default: "20"
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Listen to the LA Metro vehicle feed
        run: python pipeline/collect_realtime.py --minutes "${{ inputs.minutes || '20' }}" --out run/raw
      - name: Roll up to hourly speeds
        run: python pipeline/build_observed.py --raw run/raw --out data/observed
      - uses: actions/upload-artifact@v4
        with:
          name: raw-pings-${{ github.run_id }}
          path: run/raw
          retention-days: 90
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observed/vermont_observed_hourly.csv
          git diff --cached --quiet || git commit -m "Observed speeds $(date -u +%Y-%m-%dT%H:00Z)"
          git push
